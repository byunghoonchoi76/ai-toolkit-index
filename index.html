  .meta-row b { color: var(--ink-2); font-weight: 500; }

  /* Controls */
  .controls {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
    margin-bottom: 30px;

  .controls-inner { max-width: 1120px; margin: 0 auto; padding: 0 20px;

  .search {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line-2);

  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }

  .pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .cat-desc { color: var(--ink-2); font-size: 14px; margin: 12px 0 20px; max-width: 70ch; }

  .use-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 2px 0 0; }
  .use {

  .use .step { color: var(--code-ink); white-space: pre-wrap; display: block; }
  .card-foot { margin-top: auto; padding-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card-foot a { color: var(--accent); text-decoration: none; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-foot a:hover { text-decoration: underline; }

  .kind { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 2px 7px; white-space: nowrap; flex: none; }

  .locked-note { background: var(--c-lock-bg); border: 1px solid var(--line); border-left: 3px solid var(--lock); border-radius: 10px; padding: 14px 16px; font-size: 13px; color: var(--ink-2); }
  .locked-note b { color: var(--lock); }
  .locked-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: 10px; margin-top: 14px; }
  .locked-item { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; font-size: 13px; }
  .locked-item .li-t { font-weight: 600; color: var(--ink); }
  .locked-item .li-u { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-3); word-break: break-all; margin-top: 3px; }

  .empty { display: none; text-align: center; color: var(--ink-3); padding: 60px 0; font-family: "IBM Plex Mono", monospace; }
  footer { margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; font-family: "IBM Plex Mono", monospace; }
  @media (max-width: 560px) { .grid, .locked-list { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

function cardHTML(t){
  const feats = t.feat.map(f=>`<li>${f}</li>`).join('');
  const star = t.star ? `<span class="star">${t.star}</span>` : '';
  const short = t.url.replace(/^https?:\/\//,'').replace(/\/$/,'');
  const shortDisp = short.length>42 ? short.slice(0,40)+'…' : short;
  return `<article class="card" data-cat="${t.cat}" data-txt="${(t.n+' '+t.tag+' '+t.what+' '+t.feat.join(' ')+' '+t.cat).toLowerCase().replace(/"/g,'')}" style="--cc:${catColor(t.cat)}">
    <div class="card-top"><div><h3>${t.n}</h3><p class="tagline">${t.tag}</p></div>${star}</div>
    <p class="what">${t.what}</p>
    <ul class="feat">${feats}</ul>
    <p class="use-label">사용법</p>
    <pre class="use">${cmdHTML(t.use)}</pre>
    <div class="card-foot"><a href="${t.url}" target="_blank" rel="noopener">${shortDisp} ↗</a><span class="kind">${t.kind}</span></div>
  </article>`;
}
const counts = {};
T.forEach(t=>counts[t.cat]=(counts[t.cat]||0)+1);
CATS.forEach(([id,name,desc])=>{
  const items = T.filter(t=>t.cat===id);
  if(!items.length) return;
  const sec = document.createElement('section');
  sec.className='cat'; sec.id='sec-'+id; sec.style.setProperty('--cc', catColor(id));
  sec.innerHTML = `<div class="cat-head" style="--cc:${catColor(id)}"><span class="dot"></span><h2>${name}</h2><span class="count">${items.length}</span></div>
    <p class="cat-desc">${desc}</p>
    <div class="grid">${items.map(cardHTML).join('')}</div>`;
  cats.appendChild(sec);
});

// pills
const pills = document.getElementById('pills');
const catList = CATS.filter(c=>counts[c[0]]);
let active = 'all';
function mkPill(id,label,n){
  const b=document.createElement('button'); b.className='pill'; b.dataset.id=id;
  b.setAttribute('aria-pressed', id==='all'); b.type='button';
  b.innerHTML = label + (n!=null?`<span class="n">${n}</span>`:'');
  b.onclick=()=>{ active=id; document.querySelectorAll('.pill').forEach(p=>p.setAttribute('aria-pressed', p.dataset.id===id)); apply();
    if(id!=='all'){ const el=document.getElementById('sec-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); } };
  return b;
}
pills.appendChild(mkPill('all','전체',T.length));
catList.forEach(([id,name])=> pills.appendChild(mkPill(id, name.split(' · ')[0], counts[id])));

// search + filter
const q = document.getElementById('q');
const empty = document.getElementById('empty');
function apply(){
  const term = q.value.trim().toLowerCase();
  let anyGlobal=false;
  document.querySelectorAll('section.cat').forEach(sec=>{
    if(sec.id==='sec-lock') return;
    const id = sec.id.replace('sec-','');
    const catOK = (active==='all' || active===id);
    let anyInSec=false;
    sec.querySelectorAll('.card').forEach(card=>{
      const match = catOK && (!term || card.dataset.txt.includes(term));
      card.style.display = match?'':'none';
      if(match){ anyInSec=true; anyGlobal=true; }
    });
    sec.style.display = anyInSec?'':'none';
  });
  empty.style.display = anyGlobal?'none':'block';
}
q.addEventListener('input', apply);
apply();
</script>
</body>
