// ---- render ----
const cats = document.getElementById('cats');
const catColor = c => `var(--c-${c})`;
function cmdHTML(use){
  return use.map(([type,txt])=>{
    const esc = txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(type==='cmd') return `<span class="c">$ ${esc}</span>`;
    return `<span class="step">${esc}</span>`;
  }).join('\n');
}
function cardHTML(t){
  const feats = t.feat.map(f=>`<li>${f}</li>`).join('');
  const star = t.star ? `<span class="star">${t.star}</span>` : '';
  const short = t.url.replace(/^https?:\/\//,'').replace(/\/$/,'');
  const shortDisp = short.length>42 ? short.slice(0,40)+'?? : short;
  return `<article class="card" data-cat="${t.cat}" data-txt="${(t.n+' '+t.tag+' '+t.what+' '+t.feat.join(' ')+' '+t.cat).toLowerCase().replace(/"/g,'')}" style="--cc:${catColor(t.cat)}">
    <div class="card-top"><div><h3>${t.n}</h3><p class="tagline">${t.tag}</p></div>${star}</div>
    <p class="what">${t.what}</p>
    <ul class="feat">${feats}</ul>
    <p class="use-label">?ъ슜踰?/p>
    <pre class="use">${cmdHTML(t.use)}</pre>
    <div class="card-foot"><a href="${t.url}" target="_blank" rel="noopener">${shortDisp} ??/a><span class="kind">${t.kind}</span></div>
  </article>`;
}
const counts = {};
T.forEach(t=>counts[t.cat]=(counts[t.cat]||0)+1);
CATS.forEach(([id,name,desc])=>{
  const items = T.filter(t=>t.cat===id);
  if(!items.length) return;
  const sec = document.createElement('section');
  sec.className='cat'; sec.id='sec-'+id; sec.style.setProperty('--cc', catColor(id));
  sec.innerHTML = `<div class="cat-head" style="--cc:${catColor(id)}"><span class="dot"></span><h2>${name}</h2><span class="count">${items.length}</span></div>
    <p class="cat-desc">${desc}</p>
    <div class="grid">${items.map(cardHTML).join('')}</div>`;
  cats.appendChild(sec);
});

// pills
const pills = document.getElementById('pills');
const catList = CATS.filter(c=>counts[c[0]]);
let active = 'all';
function mkPill(id,label,n){
  const b=document.createElement('button'); b.className='pill'; b.dataset.id=id;
  b.setAttribute('aria-pressed', id==='all'); b.type='button';
  b.innerHTML = label + (n!=null?`<span class="n">${n}</span>`:'');
  b.onclick=()=>{ active=id; document.querySelectorAll('.pill').forEach(p=>p.setAttribute('aria-pressed', p.dataset.id===id)); apply();
    if(id!=='all'){ const el=document.getElementById('sec-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); } };
  return b;
}
pills.appendChild(mkPill('all','?꾩껜',T.length));
catList.forEach(([id,name])=> pills.appendChild(mkPill(id, name.split(' 쨌 ')[0], counts[id])));

// search + filter
const q = document.getElementById('q');
const empty = document.getElementById('empty');
function apply(){
  const term = q.value.trim().toLowerCase();
  let anyGlobal=false;
  document.querySelectorAll('section.cat').forEach(sec=>{
    if(sec.id==='sec-lock') return;
    const id = sec.id.replace('sec-','');
    const catOK = (active==='all' || active===id);
    let anyInSec=false;
    sec.querySelectorAll('.card').forEach(card=>{
      const match = catOK && (!term || card.dataset.txt.includes(term));
      card.style.display = match?'':'none';
      if(match){ anyInSec=true; anyGlobal=true; }
    });
    sec.style.display = anyInSec?'':'none';
  });
  empty.style.display = anyGlobal?'none':'block';
}
q.addEventListener('input', apply);
apply();
</script>
